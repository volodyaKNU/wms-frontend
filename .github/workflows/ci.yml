name: Frontend CI/CD

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'wms-lab' }}
  ECR_REPOSITORY: wms-frontend
  K8S_NAMESPACE: wms

jobs:
  integration:
    name: Docker Compose and Cypress
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v6
        with:
          path: wms-frontend

      - name: Checkout backend
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/wms-backend
          path: wms-backend
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wms-frontend/package-lock.json

      - name: Generate a throwaway database password
        shell: bash
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          echo "POSTGRES_PASSWORD=${password}" >> "$GITHUB_ENV"

      - name: Build and start the complete stack
        run: docker compose -f wms-backend/infra/docker-compose.yml up -d --build --wait

      - name: Install frontend dependencies
        working-directory: wms-frontend
        run: npm ci

      - name: Run Cypress
        working-directory: wms-frontend
        run: npx cypress run --browser chrome
        env:
          CYPRESS_apiUrl: http://localhost:4000

      - name: Show container logs
        if: always()
        run: docker compose -f wms-backend/infra/docker-compose.yml logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose -f wms-backend/infra/docker-compose.yml down -v

  image:
    name: Build and publish frontend image
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v6

      - name: Set lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Uses OIDC when AWS_ROLE_ARN is set, otherwise the IAM access keys.
      - name: Configure AWS credentials
        if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Log in to Amazon ECR
        if: env.PUBLISH == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Collect image tags
        id: tags
        shell: bash
        env:
          GHCR_IMAGE: ${{ steps.image.outputs.name }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          {
            echo "list<<EOF"
            echo "${GHCR_IMAGE}:latest"
            echo "${GHCR_IMAGE}:${GITHUB_SHA}"
            if [ -n "${ECR_REGISTRY}" ]; then
              echo "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
              echo "${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and optionally publish frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.list }}

  deploy-eks:
    name: Deploy frontend to AWS EKS
    needs: image
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_EKS_CD == 'true'
    runs-on: ubuntu-latest
    environment: aws-eks
    concurrency:
      group: eks-deploy-wms-frontend
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Install kubectl matching the cluster version
        shell: bash
        run: |
          minor="$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --query cluster.version --output text)"
          version="$(curl -fsSL "https://dl.k8s.io/release/stable-${minor}.txt")"
          curl -fsSLo "$RUNNER_TEMP/kubectl" "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl"
          sudo install -m 0755 "$RUNNER_TEMP/kubectl" /usr/local/bin/kubectl
          kubectl version --client

      - name: Connect kubectl to EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Update frontend Deployment
        id: set_image
        shell: bash
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          image="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}"
          kubectl set image deployment/wms-frontend frontend="${image}" --namespace "$K8S_NAMESPACE"
          kubectl annotate deployment/wms-frontend --namespace "$K8S_NAMESPACE" --overwrite \
            kubernetes.io/change-cause="GitHub Actions ${GITHUB_SHA::12} (run ${GITHUB_RUN_ID})"

      - name: Verify frontend rollout
        run: kubectl rollout status deployment/wms-frontend --namespace "$K8S_NAMESPACE" --timeout=300s

      - name: Smoke test the UI and the /api proxy
        shell: bash
        run: |
          kubectl exec deployment/wms-frontend --namespace "$K8S_NAMESPACE" -- \
            wget -qO- http://127.0.0.1/ | grep -qi '<div id="root"'
          kubectl exec deployment/wms-frontend --namespace "$K8S_NAMESPACE" -- \
            wget -qO- http://127.0.0.1/api/products >/dev/null
          echo "Frontend serves the SPA and proxies /api to the backend."

      - name: Roll back on failure
        if: failure() && steps.set_image.outcome == 'success'
        run: |
          kubectl rollout undo deployment/wms-frontend --namespace "$K8S_NAMESPACE" || true
          kubectl get pods --namespace "$K8S_NAMESPACE" -o wide || true

  deploy:
    name: Update frontend in Minikube
    needs: image
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_MINIKUBE_CD == 'true'
    runs-on: [self-hosted, wms-minikube]
    environment: minikube
    permissions:
      contents: read
      packages: read

    steps:
      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Update frontend Deployment
        run: >-
          kubectl set image deployment/wms-frontend
          frontend=${{ steps.image.outputs.name }}:${{ github.sha }}
          --namespace wms

      - name: Verify frontend rollout
        run: kubectl rollout status deployment/wms-frontend --namespace wms --timeout=180s
