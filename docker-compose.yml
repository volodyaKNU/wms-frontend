services:
  postgres:
    image: postgres:16
    container_name: wms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wms
    ports:
      - "5432:5432"
    volumes:
      - wms-postgres-data:/var/lib/postgresql/data
      - ../wms-backend/infra/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wms"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../wms-backend
    container_name: wms-backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/wms
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:4000
    container_name: wms-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  wms-postgres-data:
